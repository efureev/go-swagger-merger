name: Release

on:
  push:
    tags: ['v*']
  # Lets the image be published for an existing tag without moving it, which
  # would re-run GoReleaser against a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the image for, e.g. v2.0.0'
        required: true
      latest:
        description: 'Also move the latest tag onto this image'
        type: boolean
        default: false

# The binaries and the image are separate deliverables, so they are separate
# jobs: a registry permission problem must not stop the release from
# publishing, which is what happened when they shared one job.
jobs:
  binaries:
    name: binaries
    # Only a tag push publishes binaries; a manual run is for the image alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Requires the ghcr.io/efureev/go-swagger-merger package to be linked
          # to this repository with write access for Actions. The package was
          # created by the v1 workflow's personal access token and predates
          # this repository linkage, so until it is linked the push is denied.
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag push is always the newest release, so it takes latest. A manual
      # run is a backfill of an older tag, so it must not drag latest
      # backwards unless that is explicitly asked for.
      - name: Work out the image tags and commit
        id: meta
        run: |
          {
            # From the checkout, not from github.sha: a manual run starts on
            # the default branch, so github.sha is that branch's head while
            # the sources come from the tag, and the image would be stamped
            # with a commit it was not built from.
            echo "sha=$(git rev-parse HEAD)"
            echo "list<<TAGS"
            echo "ghcr.io/${{ github.repository }}:${VERSION}"
            if [ "${{ github.event_name }}" = push ] || [ "${{ inputs.latest }}" = true ]; then
              echo "ghcr.io/${{ github.repository }}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.list }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.meta.outputs.sha }}
